name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: loomeval
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/loomeval
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5df2 # v4.0.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@1d24570b6667224d71f4314e47090018587e224d # v4.2.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Create logs directory
        run: mkdir -p logs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: pnpm run db:migrate:deploy 2>&1 | tee logs/migrations.log

      - name: Lint
        run: pnpm run lint 2>&1 | tee logs/lint.log

      - name: Type-check
        run: pnpm run typecheck 2>&1 | tee logs/typecheck.log

      - name: Run tests
        run: pnpm run test:ci 2>&1 | tee logs/tests.log

      - name: Build
        run: pnpm run build 2>&1 | tee logs/build.log

      # ── Upload failure evidence ──────────────────────────────────────────
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Vitest reports on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: vitest-report
          path: |
            coverage/
            test-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload application logs on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: app-logs
          path: |
            logs/
            *.log
          retention-days: 30
          if-no-files-found: ignore
