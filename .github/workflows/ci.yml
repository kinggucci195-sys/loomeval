name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: loomeval
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/loomeval
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      ARTIFACT_STORE_TYPE: local
      REPLAY_ALLOWED_DOMAINS: localhost,127.0.0.1
      TRACE_RETENTION_DAYS: 30
      ARTIFACT_RETENTION_DAYS: 30
      SCREENSHOT_RETENTION_DAYS: 7

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.0.0 tag target commit

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag target commit
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag target commit
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Create logs directory
        run: mkdir -p logs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        shell: bash
        run: |
          set -o pipefail
          pnpm run db:migrate:deploy 2>&1 | tee logs/migrations.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint 2>&1 | tee logs/lint.log

      - name: Type-check
        shell: bash
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee logs/typecheck.log

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:ci 2>&1 | tee logs/tests.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee logs/build.log

      # ── Upload failure evidence ──────────────────────────────────────────
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag target commit
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Vitest reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag target commit
        with:
          name: vitest-report
          path: |
            coverage/
            test-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload application logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag target commit
        with:
          name: app-logs
          path: |
            logs/
            *.log
          retention-days: 30
          if-no-files-found: ignore
